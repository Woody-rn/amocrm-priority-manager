<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AMO CRM Priority Manager</title>
    <link rel="stylesheet" href="../shared/styles/theme.css">
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div class="sidebar-container">
    <!-- Статистика -->
    <section class="sidebar-section" id="section-stats">
        <div class="sidebar-section__header" data-target="stats-content">
            <h2 class="sidebar-section__title">📊 Статистика</h2>
            <button class="sidebar-section__toggle">▼</button>
        </div>
        <div id="stats-content" class="sidebar-section__content">
            <div id="statsList" class="stats-list"></div>
        </div>
    </section>

    <!-- Фильтры и поиск -->
    <section class="sidebar-section" id="section-filters">
        <div class="sidebar-section__header" data-target="filters-content">
            <h2 class="sidebar-section__title">🔍 Фильтры</h2>
            <button class="sidebar-section__toggle">▼</button>
        </div>
        <div id="filters-content" class="sidebar-section__content">
            <div id="filtersContainer" class="filters-container"></div>
        </div>
    </section>

    <!-- Клиенты (оставляем как есть) -->
    <section class="sidebar-section sidebar-section--grow">
        <h2 class="sidebar-section__title">👥 Клиенты</h2>
        <div id="clientsList" class="clients-list"></div>
    </section>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
