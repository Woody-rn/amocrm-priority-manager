<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AMO CRM Priority Manager - Настройки</title>
    <link rel="stylesheet" href="../shared/styles/theme.css">
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="options.css">
</head>
<body>
<div class="options-container">
    <header class="options-header">
        <div class="options-logo">
            📊 AMO CRM Priority Manager
            <span class="options-version" id="appVersion"></span>
        </div>
        <nav class="options-tabs">
            <button class="options-tab options-tab--active" data-tab="analytics">Аналитика</button>
            <button class="options-tab" data-tab="settings">Настройки</button>
            <button class="options-tab" data-tab="features">Функционал</button>
            <button class="options-tab" data-tab="history">История версий</button>
        </nav>
    </header>

    <main class="options-content">
        <!-- Аналитика -->
        <section class="options-panel" id="tab-analytics">
            <div class="options-card">
                <h2>Распределение клиентов по статусам</h2>
                <div class="chart-container" id="statsChartContainer" style="position: relative; height: 400px;"></div>
            </div>
        </section>

        <!-- Настройки (Данные тоже здесь) -->
        <section class="options-panel" id="tab-settings" style="display: none;">
            <div class="options-card">
                <h2>Основные настройки</h2>

                <div class="options-field">
                    <label for="baseUrlInput">Базовый домен amoCRM</label>
                    <input type="text" id="baseUrlInput" placeholder="https://mycompany.amocrm.ru">
                    <small>Используется для формирования ссылок на сделки.</small>
                </div>

                <div class="options-field">
                    <label for="themeSelect">Тема оформления</label>
                    <select id="themeSelect">
                        <option value="system">Системная</option>
                        <option value="light">Светлая</option>
                        <option value="dark">Тёмная</option>
                    </select>
                </div>

                <button id="saveSettingsBtn" class="btn btn-primary">Сохранить настройки</button>

                <hr style="margin: 32px 0; border: none; border-top: 1px solid var(--border-color, #eee);">

                <div class="cloud-section">
                    <h2>☁️ Синхронизация с Яндекс.Диском</h2>
                    <div class="cloud-controls">
                        <button id="cloudConnectBtn" class="btn">🔗 Подключить</button>
                        <button id="cloudUploadBtn" class="btn btn-primary" disabled>💾 Сохранить в облако</button>
                    </div>
                    <div class="cloud-status" id="cloudStatus">⚪ Не подключено</div>
                    <h3>Список бэкапов</h3>
                    <div class="cloud-backups" id="cloudBackups"></div>
                </div>

                <h2>Резервное копирование</h2>
                <div class="options-actions" style="margin-bottom: 24px;">
                    <button id="exportBtn" class="btn">📤 Экспорт JSON</button>
                    <button id="importBtn" class="btn">📥 Импорт JSON</button>
                    <input type="file" id="importFile" accept=".json" hidden>
                </div>

                <h2 style="color: var(--danger-color);">Опасная зона</h2>
                <div class="options-actions">
                    <button id="clearAllBtn" class="btn btn-danger">🗑 Очистить все данные</button>
                </div>
            </div>
        </section>

        <!-- Функционал -->
        <section class="options-panel" id="tab-features" style="display: none;">
            <div class="options-card" id="featuresContainer"></div>
        </section>

        <!-- История версий -->
        <section class="options-panel" id="tab-history" style="display: none;">
            <div class="options-card" id="historyContainer"></div>
        </section>
    </main>

    <footer class="options-footer">
        <span>AMO CRM Priority Manager</span>
    </footer>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
