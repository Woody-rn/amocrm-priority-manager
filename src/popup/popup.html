<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AMO CRM Priority Manager</title>
    <link rel="stylesheet" href="../shared/styles/theme.css">
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup-container">
    <header class="popup-header">
        <h1>AMO CRM Priority Manager</h1>
        <span class="popup-version" id="popupVersion">v...</span>
    </header>

    <section class="popup-section">
        <div class="popup-actions">
            <button id="openSidebarBtn" class="popup-btn">
                📊 Открыть панель
            </button>
            <button id="openAnalyticsBtn" class="popup-btn">
                📈 Аналитика
            </button>
            <button id="openSettingsBtn" class="popup-btn">
                ⚙️ Настройки
            </button>
        </div>
    </section>

    <section class="popup-section">
        <h2 class="popup-section__title">📊 Статистика</h2>
        <div id="popupStats" class="popup-stats"></div>
    </section>

    <footer class="popup-footer">
        <button id="helpBtn" class="popup-footer__help">ℹ️ Справка</button>
    </footer>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
