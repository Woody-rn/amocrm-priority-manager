<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AMO CRM Priority Manager</title>
    <link rel="stylesheet" href="../shared/styles/theme.css">
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup-container">
    <header class="popup-header">
        <h1>AMO CRM Priority Manager</h1>
        <span class="popup-version" id="popupVersion">v...</span>
    </header>

    <section class="popup-section">
        <div class="popup-actions">
            <button id="openAnalyticsBtn" class="popup-btn">
                📈 Аналитика
            </button>
            <button id="openSettingsBtn" class="popup-btn">
                ⚙️ Настройки
            </button>
            <button id="helpBtn" class="popup-btn">
                ℹ️ Справка
            </button>
        </div>
    </section>

    <section class="popup-section">
        <label class="popup-stat-row" style="padding-left: 0; padding-top: 4px;">
            <input type="checkbox" id="groupTasksByDateToggle" class="popup-stat-checkbox">
            <span class="popup-stat-label" style="font-weight: 500;">Разделять задачи по датам</span>
        </label>
    </section>

    <section class="popup-section">
        <div class="popup-section__header">
            <h2 class="popup-section__title">Отображение статусов</h2>
            <div class="popup-toggle-all">
                <button id="selectAllBtn" class="popup-btn-small">Все</button>
                <button id="deselectAllBtn" class="popup-btn-small">Ничего</button>
            </div>
        </div>
        <div id="popupStats" class="popup-stats"></div>
    </section>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
