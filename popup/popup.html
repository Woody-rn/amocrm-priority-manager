<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>AMO CRM Priority Manager</h1>
        
        <div class="card">
            <h2>Действия</h2>
            <div class="actions">
                <button id="openSidebarBtn" class="btn">📊 Открыть панель</button>
                <button id="exportBtn" class="btn btn-secondary">📤 Экспорт JSON</button>
                <button id="importBtn" class="btn btn-secondary">📥 Импорт JSON</button>
                <button id="clearAllBtn" class="btn btn-danger">🗑 Очистить всё</button>
                <input type="file" id="importFile" accept=".json" hidden>
            </div>
        </div>
        
        <div class="card">
            <h2>Статистика</h2>
            <div id="statsList">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
        
        <div class="footer">
            <span id="versionText">v...</span>
        </div>
    </div>
    
    <script type="module" src="popup.js"></script>
</body>
</html>
